# Node_taras — Wemos D1 Mini (ESP8266)
# Ultradźwięk: zbiornik pod tarasem 5600 l; pływak MAX taras
# GPIO: D1/D2 taras, D7 MAX (plan ogrodu)
#
# Montaż przy zbiorniku tarasowym — krótkie kable do sondy i pływaka.

substitutions:
  device_name: node-taras
  friendly_name: "Node Taras"
  topic_prefix: ogrod/node_taras
  # 0% ≈ rezerwa ~1000 l (~18%); 100% = pełny użytkowy — skalibruj w terenie
  taras_distance_full_m: "0.35"
  taras_distance_empty_m: "2.50"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2024.1.0
  project:
    name: ogrod.node_taras
    version: "1.0.0"

esp8266:
  board: d1_mini
  restore_from_flash: true

packages:
  wifi_api: !include common/wifi_api.yaml
  mqtt: !include common/mqtt.yaml

sensor:
  - platform: ultrasonic
    id: taras_distance
    name: "Taras odległość"
    trigger_pin: D1
    echo_pin: D2
    unit_of_measurement: m
    accuracy_decimals: 2
    update_interval: 5s
    pulse_time: 20us
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 5
      - lambda: |-
          if (isnan(x) || x < 0.02 || x > 4.5) return NAN;
          return x;

  - platform: template
    id: taras_percent
    name: "Taras poziom"
    icon: mdi:water-percent
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 10s
    lambda: |-
      if (isnan(id(taras_distance).state)) return NAN;
      const float full_d = ${taras_distance_full_m};
      const float empty_d = ${taras_distance_empty_m};
      float d = id(taras_distance).state;
      if (d <= full_d) return 100.0f;
      if (d >= empty_d) return 0.0f;
      return (empty_d - d) / (empty_d - full_d) * 100.0f;

binary_sensor:
  - platform: gpio
    id: taras_max
    name: "Taras MAX"
    icon: mdi:water-alert
    device_class: problem
    pin:
      number: D7
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 200ms
      - delayed_off: 200ms
